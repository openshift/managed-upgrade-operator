---
apiVersion: v1
kind: Service
metadata:
  name: managed-upgrade-operator-preflight
  namespace: openshift-managed-upgrade-operator
  annotations:
    # OpenShift Service Serving CA: automatically provisions and rotates a
    # signed TLS certificate into the secret named below.
    service.beta.openshift.io/serving-cert-secret-name: muo-preflight-tls
  labels:
    name: managed-upgrade-operator
spec:
  selector:
    name: managed-upgrade-operator
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
  type: ClusterIP
